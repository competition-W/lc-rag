version: '3.5'

services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    container_name: milvus-redis
    image: redis:7.0
    ports:
      - "6379:6379"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.5.13-gpu
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              device_ids: ["1"]
    depends_on:
      - "etcd"
      - "minio"

  lc_knowledge:
    build:
      dockerfile: ./Dockerfile
      context: ./
    container_name: retrival-lc_knowledge
    volumes:
      - ./rag:/rag
      - ./data:/data
      - ./.env:/.env
    ports:
      - "8849:8848"
    depends_on:
      - "redis"
    # command: ["uv", "run", "main.py"]

  celery_worker:
    build:
      dockerfile: ./Dockerfile
      context: ./
    container_name: retrival-celery-worker
    volumes:
      - ./rag:/rag
      - ./data:/data
      - ./.env:/.env
    depends_on:
      - "redis"
      - "lc_knowledge"
    command: ["python", "-m", "uv", "run", "tasks/celery_app.py", "worker", "--loglevel=info"]

  celery_beat:
    build:
      dockerfile: ./Dockerfile
      context: ./
    container_name: retrival-celery-beat
    volumes:
      - ./rag:/rag
      - ./data:/data
      - ./.env:/.env
    depends_on:
      - "redis"
      - "celery_worker"
    command: ["python", "-m", "uv", "run", "tasks/celery_app.py", "beat", "--loglevel=info"]

networks:
  default:
    name: milvus
